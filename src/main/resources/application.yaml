spring:
  application:
    name: outfitapp
  datasource:
    url: jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:outfitapp}
    username: ${PGUSER:postgres}
    password: ${PGPASSWORD:password}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

gcs:
  bucket: outfitapp-wardrobe-photos
  signed-url-expiry-minutes: 15
  # Inline key JSON, or leave unset and use GOOGLE_APPLICATION_CREDENTIALS (file path)
  service-account-json: ${GCS_SERVICE_ACCOUNT_JSON:}
  pubsub:
    # Project number (distinct from the project ID below) for outfit-app-503420: 578384980634
    # Reference only, not read by the app - needed for the Pub/Sub service agent identity
    # (service-578384980634@gcp-sa-pubsub.iam.gserviceaccount.com) used in the DLQ IAM binding
    # gcloud commands documented in GcsConfig.
    project-id: outfit-app-503420
    subscription-id: photo-uploaded-sub
    # Concurrent GCS finalize handlers on this JVM (batch photos extract in parallel).
    parallel-pull-count: 1
    max-outstanding-element-count: 6

qwen:
  api-key: ${QWEN_API_KEY}
  model: qwen3.6-flash
  base-url: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
  # Cap CoT on outfit recommend, buy advice, and eval judge; detection/metadata/retrieval turn thinking off.
  advice-thinking-budget: 1024
  # LLM accept/reject after OutfitStructureValidator; disable to skip the second model call.
  reasonableness-enabled: true
