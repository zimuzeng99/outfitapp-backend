spring:
  application:
    name: outfitapp
  datasource:
    url: jdbc:postgresql://localhost:5432/outfitapp
    username: postgres
    password: password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

gcs:
  bucket: outfitapp-wardrobe-photos
  signed-url-expiry-minutes: 15
  pubsub:
    # Project number (distinct from the project ID below) for outfit-app-503420: 578384980634
    # Reference only, not read by the app - needed for the Pub/Sub service agent identity
    # (service-578384980634@gcp-sa-pubsub.iam.gserviceaccount.com) used in the DLQ IAM binding
    # gcloud commands documented in GcsConfig.
    project-id: outfit-app-503420
    subscription-id: photo-uploaded-sub

gemini:
  api-key: ${GEMINI_API_KEY}
  model: gemini-3.6-flash
  image-model: gemini-3.1-flash-image

qwen:
  api-key: ${QWEN_API_KEY}
  model: qwen3-vl-flash
  base-url: https://dashscope-intl.aliyuncs.com/compatible-mode/v1

garment:
  # Which LLM provider runs garment detection + metadata extraction (not the cutout image
  # generation, which stays Gemini-only regardless of this setting). One of: gemini, qwen.
  analysis-provider: qwen
